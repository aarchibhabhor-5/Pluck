<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication — Pluck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app-style.css" />
</head>

<body>
  <!-- Full-page Matrix Rain -->
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <div class="auth-page">
    <div class="auth-card pixel-border-box">

      <!-- Header with Pixel Octopus Logo -->
      <div class="auth-header">
        <a href="index.html" title="Back to Pluck Home">
          <img src="squid.png" alt="Pluck" class="auth-logo-squid" width="48" height="48" />
        </a>
        <h1 class="auth-title">Pluck</h1>
        <p style="font-size: 11px; color: var(--muted); margin-top: -6px;">Dependency-aware snippet vault</p>
      </div>

      <!-- Mode Switcher Tabs (Login / Sign Up) -->
      <div class="auth-tabs" id="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Sign In</div>
        <div class="auth-tab" id="tab-signup" onclick="switchAuthMode('signup')">Create Account</div>
      </div>

      <!-- OAuth Providers -->
      <div class="oauth-buttons">
        <button class="btn-oauth" onclick="simulateOAuth('GitHub')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
          </svg>
          Continue with GitHub
        </button>
        <button class="btn-oauth" onclick="simulateOAuth('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335" />
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="auth-divider">or with email</div>

      <!-- Email / Password Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="email">WORK EMAIL</label>
          <input type="email" id="email" class="form-input" placeholder="developer@company.com" required />
        </div>

        <div class="form-group" style="margin-top: 14px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="password">PASSWORD</label>
            <a href="#" id="forgot-link" onclick="openForgotModal(event)" style="font-size: 10px; color: var(--purple-light);">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••••••" minlength="10" required
            oninput="checkPasswordStrength(this.value)" />

          <!-- Password strength indicators (shown on signup) -->
          <div class="pw-strength" id="pw-strength-container" style="display: none;">
            <div class="pw-bars">
              <div class="pw-bar" id="pw-bar-1"></div>
              <div class="pw-bar" id="pw-bar-2"></div>
              <div class="pw-bar" id="pw-bar-3"></div>
            </div>
            <span class="pw-text" id="pw-strength-text">Password must be ≥10 characters</span>
          </div>
        </div>

        <!-- Inline error alert -->
        <div id="auth-error" style="display: none; margin-top: 14px; padding: 8px 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; font-size: 11px;">
        </div>

        <button type="submit" class="btn-solid-pixel" id="auth-submit-btn" style="width: 100%; margin-top: 20px; padding: 12px;">
          Sign In to Vault
        </button>
      </form>

      <!-- Terms disclaimer -->
      <p style="font-size: 10px; color: var(--muted); text-align: center; line-height: 1.6;">
        By continuing, you agree to Pluck's <a href="#" class="underline-cyan">Terms</a> and <a href="#" class="underline-pink">Privacy Policy</a>. Secrets are auto-scanned client-side before save.
      </p>

    </div>
  </div>

  <script src="app-script.js"></script>
  <script>
    let currentMode = 'login';

    function switchAuthMode(mode) {
      currentMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('pw-strength-container').style.display = mode === 'signup' ? 'flex' : 'none';
      document.getElementById('forgot-link').style.display = mode === 'login' ? 'inline' : 'none';
      document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign In to Vault' : 'Create Pluck Account';
      document.getElementById('auth-error').style.display = 'none';
    }

    function checkPasswordStrength(val) {
      if (currentMode !== 'signup') return;
      const b1 = document.getElementById('pw-bar-1');
      const b2 = document.getElementById('pw-bar-2');
      const b3 = document.getElementById('pw-bar-3');
      const txt = document.getElementById('pw-strength-text');

      b1.className = 'pw-bar';
      b2.className = 'pw-bar';
      b3.className = 'pw-bar';

      if (val.length < 8) {
        txt.textContent = 'Too short (min 10 chars)';
      } else if (val.length < 10) {
        b1.className = 'pw-bar active-weak';
        txt.textContent = 'Weak password';
      } else if (val.length < 14 || !/[0-9!@#$%^&*]/.test(val)) {
        b1.className = 'pw-bar active-medium';
        b2.className = 'pw-bar active-medium';
        txt.textContent = 'Medium strength';
      } else {
        b1.className = 'pw-bar active-strong';
        b2.className = 'pw-bar active-strong';
        b3.className = 'pw-bar active-strong';
        txt.textContent = 'Strong battle-tested password';
      }
    }

    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next') || 'app.html';

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('auth-submit-btn');
      btn.textContent = 'Authenticating...';
      btn.disabled = true;

      setTimeout(() => {
        showToast('Authentication successful! Welcome to Pluck.', 'success');
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 600);
      }, 700);
    }

    function simulateOAuth(provider) {
      showToast(`Redirecting to ${provider} OAuth...`, 'info');
      setTimeout(() => {
        window.location.href = nextUrl;
      }, 700);
    }

    function openForgotModal(e) {
      e.preventDefault();
      const email = prompt('Enter your email to receive a password reset link:');
      if (email) {
        showToast(`Reset link dispatched to ${email}`, 'success');
      }
    }

    // Read query parameter ?mode=signup
    if (params.get('mode') === 'signup') {
      switchAuthMode('signup');
    }
  </script>
</body>

</html>
