<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snippet Studio — Pluck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app-style.css" />
  <link rel="stylesheet" href="border-glow.css" />
  <link rel="stylesheet" href="animated-list.css" />

  <!-- Monaco Code Editor AMD Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════
       ELEVATED STUDIO UI DESIGN SYSTEM
       Rich visual differentiation, 3D tactility & contrast
       ══════════════════════════════════════════════════════ */
    .studio-shell {
      background: #080a11 !important;
    }

    /* Elevated Header Bar */
    .studio-header {
      height: 66px !important;
      padding: 0 24px !important;
      background: linear-gradient(180deg, #181d2c 0%, #0f131f 100%) !important;
      border-bottom: 1px solid rgba(139, 92, 246, 0.4) !important;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      z-index: 20;
      position: relative;
    }

    /* Elevated Back Button */
    .btn-vault-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: linear-gradient(180deg, #1e2538 0%, #121624 100%);
      border: 1px solid #3b455e;
      border-bottom: 2px solid #090d16;
      border-radius: 5px;
      color: #94a3b8;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-vault-back:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .btn-vault-back:active {
      transform: translateY(1px);
    }

    /* Elevated Title Input Box */
    .studio-title-input {
      background: #090d16 !important;
      border: 1px solid #334155 !important;
      border-bottom: 2px solid #1e293b !important;
      border-radius: 5px !important;
      font-family: var(--mono) !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      padding: 9px 16px !important;
      min-width: 320px !important;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75), 0 1px 0 rgba(255, 255, 255, 0.08) !important;
      outline: none !important;
      transition: all 0.2s ease !important;
    }
    .studio-title-input::placeholder {
      color: #64748b;
      font-weight: 400;
    }
    .studio-title-input:hover {
      border-color: #475569 !important;
    }
    .studio-title-input:focus {
      border-color: #38bdf8 !important;
      background: #0d121f !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25), inset 0 2px 5px rgba(0, 0, 0, 0.75) !important;
    }

    /* Elevated Status Pill Badge */
    #save-status-pill {
      background: rgba(16, 185, 129, 0.15) !important;
      border: 1px solid rgba(16, 185, 129, 0.6) !important;
      border-radius: 999px !important;
      padding: 4px 12px !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25) !important;
    }

    /* Elevated Dropdown Selects */
    .studio-header .select-pixel {
      background: linear-gradient(180deg, #1e2538 0%, #111624 100%) !important;
      border: 1px solid #475569 !important;
      border-bottom: 3px solid #090d16 !important;
      border-radius: 5px !important;
      color: #f1f5f9 !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 8px 14px !important;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
      cursor: pointer !important;
      outline: none !important;
      transition: all 0.15s ease !important;
    }
    .studio-header .select-pixel:hover {
      border-color: #818cf8 !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 5px 14px rgba(129, 140, 248, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
    }
    .studio-header .select-pixel:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3) !important;
    }

    /* Elevated Dark Dropdown Options (Fixes white-on-white text) */
    .select-pixel option,
    select option {
      background-color: #161b29 !important;
      color: #f1f5f9 !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
      padding: 10px 14px !important;
    }

    /* Elevated 3D Save CTA Button */
    #btn-save {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%) !important;
      border: 1px solid #67e8f9 !important;
      border-bottom: 3px solid #1e3a8a !important;
      border-radius: 5px !important;
      color: #ffffff !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 9px 20px !important;
      letter-spacing: 0.5px !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6) !important;
      box-shadow: 0 4px 16px rgba(6, 182, 212, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
      cursor: pointer !important;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    #btn-save:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 22px rgba(6, 182, 212, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.5) !important;
    }
    #btn-save:active {
      transform: translateY(1px) !important;
      border-bottom-width: 1px !important;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.3) !important;
    }

    /* Monaco Editor Frame */
    .studio-editor-pane {
      background: #080b12 !important;
      border-right: 1px solid rgba(139, 92, 246, 0.3) !important;
      padding: 14px !important;
    }
    .studio-code-area {
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 6px 25px rgba(0, 0, 0, 0.5) !important;
      overflow: hidden !important;
    }

    /* Elevated Right Inspector Panel */
    .studio-inspector {
      width: 380px !important;
      background: linear-gradient(180deg, #131724 0%, #0c0f18 100%) !important;
      border-left: 1px solid rgba(139, 92, 246, 0.35) !important;
      box-shadow: -6px 0 25px rgba(0, 0, 0, 0.6) !important;
    }

    /* Elevated Inspector Tabs */
    .inspector-tabs {
      background: #090d16 !important;
      border-bottom: 2px solid #1e2438 !important;
      padding: 8px 10px 0 !important;
      gap: 6px !important;
    }
    .inspector-tab {
      background: #141826 !important;
      border: 1px solid #283046 !important;
      border-bottom: none !important;
      border-radius: 5px 5px 0 0 !important;
      color: #94a3b8 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 8px 12px !important;
      transition: all 0.15s ease !important;
    }
    .inspector-tab:hover {
      color: #f1f5f9 !important;
      background: #1c2236 !important;
    }
    .inspector-tab.active {
      background: #1e2438 !important;
      color: #38bdf8 !important;
      border-color: #38bdf8 !important;
      border-top: 2px solid #38bdf8 !important;
      box-shadow: 0 -2px 12px rgba(56, 189, 248, 0.3) !important;
    }

    /* Elevated Inspector Textboxes & Textareas */
    .var-input,
    #add-pkg-input,
    #snippet-desc,
    #snippet-tags {
      background: #080b12 !important;
      border: 1px solid #334155 !important;
      border-bottom: 2px solid #1e293b !important;
      border-radius: 5px !important;
      color: #f8fafc !important;
      font-family: var(--mono) !important;
      font-size: 12px !important;
      padding: 9px 12px !important;
      outline: none !important;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75), 0 1px 0 rgba(255, 255, 255, 0.08) !important;
      transition: all 0.2s ease !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .var-input:hover,
    #add-pkg-input:hover,
    #snippet-desc:hover,
    #snippet-tags:hover {
      border-color: #475569 !important;
    }
    .var-input:focus,
    #add-pkg-input:focus,
    #snippet-desc:focus,
    #snippet-tags:focus {
      border-color: #38bdf8 !important;
      background: #0d121f !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25), inset 0 2px 5px rgba(0, 0, 0, 0.75) !important;
    }

    /* Elevated Add Dependency Button */
    .btn-outline-pixel {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%) !important;
      border: 1px solid #475569 !important;
      border-bottom: 2px solid #020617 !important;
      border-radius: 5px !important;
      color: #38bdf8 !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 9px 16px !important;
      cursor: pointer !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1) !important;
      transition: all 0.15s ease !important;
    }
    .btn-outline-pixel:hover {
      border-color: #38bdf8 !important;
      color: #fff !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35) !important;
    }
    .btn-outline-pixel:active {
      transform: translateY(1px) !important;
    }

    /* Normal Elevated Inspector Cards */
    #detected-packages-list,
    #detected-env-list,
    #detected-vars-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #detected-packages-list > div,
    #detected-env-list > div,
    #detected-vars-list > div {
      background: linear-gradient(180deg, #181d2c 0%, #101420 100%) !important;
      border: 1px solid #334155 !important;
      border-left: 3px solid #8b5cf6 !important;
      border-radius: 5px !important;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
      padding: 10px 14px;
      transition: all 0.15s ease;
    }

    #detected-packages-list > div:hover,
    #detected-env-list > div:hover,
    #detected-vars-list > div:hover {
      border-color: #475569 !important;
      border-left-color: #a78bfa !important;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.6) !important;
    }

    #detected-env-list > div {
      border-left: 3px solid #38bdf8 !important;
    }
    #detected-env-list > div:hover {
      border-left-color: #7dd3fc !important;
    }

    #detected-vars-list > div {
      border-left: 3px solid #fbbf24 !important;
    }
    #detected-vars-list > div:hover {
      border-left-color: #fde047 !important;
    }

    /* Secret Detection Banner Elevation */
    .secret-banner {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(185, 28, 28, 0.35) 100%) !important;
      border: 1px solid #ef4444 !important;
      border-radius: 6px !important;
      margin-bottom: 12px !important;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
    }
    .btn-danger-pixel {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important;
      border: 1px solid #f87171 !important;
      border-bottom: 2px solid #7f1d1d !important;
      border-radius: 5px !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45) !important;
      font-weight: 700 !important;
      cursor: pointer !important;
    }
    .btn-danger-pixel:hover {
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.7) !important;
      transform: translateY(-1px) !important;
    }
    .btn-outline-danger {
      background: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid #f87171 !important;
      border-radius: 5px !important;
      color: #fca5a5 !important;
      cursor: pointer !important;
    }
    .btn-outline-danger:hover {
      background: rgba(239, 68, 68, 0.2) !important;
    }

    /* ══════════════════════════════════════════════════════
       CUSTOM ANIMATED DROPDOWNS (React Bits Integration)
       ══════════════════════════════════════════════════════ */
    .custom-dropdown-container {
      position: relative;
    }

    .custom-dropdown-trigger {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 10px !important;
      background: linear-gradient(180deg, #1e2438 0%, #101422 100%) !important;
      border: 1px solid #3b4262 !important;
      border-bottom: 2px solid #080b12 !important;
      border-radius: 6px !important;
      color: #38bdf8 !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 8px 14px !important;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
      cursor: pointer !important;
      outline: none !important;
      transition: all 0.15s ease !important;
      user-select: none !important;
      white-space: nowrap !important;
    }

    .custom-dropdown-trigger:hover {
      border-color: #818cf8 !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 5px 14px rgba(129, 140, 248, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
    }

    .custom-dropdown-trigger.active {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35) !important;
      background: linear-gradient(180deg, #252e46 0%, #151a2c 100%) !important;
    }

    .custom-dropdown-trigger .dropdown-chevron {
      transition: transform 0.22s cubic-bezier(0.34, 1.5, 0.64, 1) !important;
    }

    .custom-dropdown-trigger.active .dropdown-chevron {
      transform: rotate(180deg) !important;
    }

    .custom-dropdown-popover {
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 1px rgba(139, 92, 246, 0.5)) !important;
      animation: dropdownPopFade 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      transform-origin: top left !important;
    }

    @keyframes dropdownPopFade {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="studio-shell">

    <!-- ░░░ STUDIO HEADER ░░░ -->
    <header class="studio-header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="app.html" title="Back to Vault" class="btn-vault-back">← Vault</a>
        <input type="text" id="snippet-title" class="studio-title-input" value="" placeholder="Enter snippet title..." />
        <span class="dep-chip" id="save-status-pill">● Ready</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <!-- Hidden Native Selects for backward compatibility with scripts -->
        <select class="select-pixel" id="select-lang" onchange="changeLanguage(this.value)" style="display: none;">
          <option value="typescript" selected>TypeScript (.ts)</option>
          <option value="javascript">JavaScript (.js)</option>
          <option value="python">Python (.py)</option>
          <option value="go">Go (.go)</option>
          <option value="sql">SQL (.sql)</option>
          <option value="json">JSON (.json)</option>
          <option value="html">HTML (.html)</option>
          <option value="css">CSS (.css)</option>
          <option value="rust">Rust (.rs)</option>
          <option value="java">Java (.java)</option>
          <option value="shell">Shell (.sh)</option>
        </select>

        <select class="select-pixel" id="select-folder" style="display: none;">
          <option value="hooks" selected>Folder: hooks</option>
          <option value="auth">Folder: auth</option>
          <option value="aws-infra">Folder: aws-infra</option>
          <option value="database">Folder: database</option>
        </select>

        <select class="select-pixel" id="select-visibility" onchange="checkVisibilityGating(this.value)" style="display: none;">
          <option value="private" selected>🔒 Private</option>
          <option value="team">👥 Team</option>
          <option value="unlisted">🔗 Unlisted</option>
          <option value="public">🌐 Public</option>
        </select>

        <!-- 1. Language Dropdown (React Bits AnimatedList) -->
        <div class="custom-dropdown-container" id="lang-dropdown-container">
          <button type="button" class="custom-dropdown-trigger" id="lang-dropdown-trigger" onclick="toggleLangDropdown(event)">
            <span id="lang-dropdown-text">TypeScript (.ts)</span>
            <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="lang-dropdown-popover" class="custom-dropdown-popover" style="display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 100; min-width: 300px;">
            <div id="lang-animated-list"></div>
          </div>
        </div>

        <!-- 2. Folder Dropdown (React Bits AnimatedList) -->
        <div class="custom-dropdown-container" id="folder-dropdown-container">
          <button type="button" class="custom-dropdown-trigger" id="folder-dropdown-trigger" onclick="toggleFolderDropdown(event)">
            <span id="folder-dropdown-text">📁 Folder: hooks</span>
            <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="folder-dropdown-popover" class="custom-dropdown-popover" style="display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 100; min-width: 290px;">
            <div id="folder-animated-list"></div>
          </div>
        </div>

        <!-- 3. Visibility Dropdown (React Bits AnimatedList) -->
        <div class="custom-dropdown-container" id="visibility-dropdown-container">
          <button type="button" class="custom-dropdown-trigger" id="visibility-dropdown-trigger" onclick="toggleVisibilityDropdown(event)">
            <span id="visibility-dropdown-text">🔒 Private</span>
            <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="visibility-dropdown-popover" class="custom-dropdown-popover" style="display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 100; min-width: 310px;">
            <div id="visibility-animated-list"></div>
          </div>
        </div>

        <button class="btn-solid-pixel" id="btn-save" onclick="saveSnippet()" style="font-size: 11px; padding: 7px 16px;">
          Save (⌘S)
        </button>
      </div>
    </header>

    <!-- ░░░ STUDIO MAIN BODY ░░░ -->
    <div class="studio-body">

      <!-- Center Code Editor Pane -->
      <div class="studio-editor-pane">

        <!-- Live Secret Detection Banner (Gating Alert) -->
        <div class="secret-banner" id="secret-banner" style="display: none;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 14px;">⚠️</span>
            <span><strong>Secret Detected:</strong> Potential credential key found in snippet.</span>
          </div>
          <div class="secret-banner-actions">
            <button class="btn-outline-danger" onclick="ignoreSecret()">Ignore</button>
            <button class="btn-danger-pixel" onclick="redactSecret()">⚡ Redact → process.env.API_KEY</button>
          </div>
        </div>

        <!-- Monaco Code Editor Container -->
        <div class="studio-code-area" style="position: relative; flex: 1; height: 100%; min-height: 0; padding: 0; overflow: hidden; background: #0b0f19;">
          <div id="monaco-container" style="width: 100%; height: 100%; min-height: 520px;"></div>
        </div>

      </div>

      <!-- Right Inspector Panel -->
      <aside class="studio-inspector">

        <!-- Inspector Tabs -->
        <div class="inspector-tabs">
          <button class="inspector-tab active" id="tab-btn-pkgs" onclick="switchInspectorTab('pkgs')">Packages (<span id="pkg-count">0</span>)</button>
          <button class="inspector-tab" id="tab-btn-vars" onclick="switchInspectorTab('vars')">Variables (<span id="var-count">0</span>)</button>
          <button class="inspector-tab" id="tab-btn-env" onclick="switchInspectorTab('env')">Env Keys (<span id="env-count">0</span>)</button>
          <button class="inspector-tab" id="tab-btn-details" onclick="switchInspectorTab('details')">Details</button>
        </div>

        <!-- Inspector Content: Packages Tab -->
        <div class="inspector-content" id="panel-pkgs">
          <div>
            <div class="nav-section-title">Detected Dependencies (AST)</div>
            <div id="detected-packages-list"></div>
          </div>

          <div style="margin-top: 14px;">
            <div class="nav-section-title">+ Add Manual Dependency</div>
            <div style="display: flex; gap: 6px; margin-top: 6px;">
              <input type="text" id="add-pkg-input" class="var-input" placeholder="e.g. lodash-es" style="flex: 1;" />
              <button class="btn-outline-pixel" onclick="addManualPkg()" style="font-size: 11px;">Add</button>
            </div>
          </div>

          <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--purple-dim); font-size: 11px; color: var(--muted);">
            <div><strong>Ignored stdlib:</strong> <code>node:path</code>, <code>node:fs</code>, <code>os</code></div>
          </div>
        </div>

        <!-- Inspector Content: Variables Tab -->
        <div class="inspector-content" id="panel-vars" style="display: none;">
          <div class="nav-section-title">Dynamic Interpolated Variables</div>
          <p style="font-size: 11px; color: var(--muted); line-height: 1.5;">Syntax: <code>{{name|default}}</code>. Values can be filled before copying.</p>

          <div id="detected-vars-list"></div>
        </div>

            <label class="form-label">DESCRIPTION (MARKDOWN)</label>

          </div>
          <div class="form-group" style="margin-top: 14px;">
            <label class="form-label">TAGS (COMMA SEPARATED)</label>
            <input type="text" id="snippet-tags" class="var-input" value="react, hook, performance" placeholder="e.g. react, hooks, api" />

  <script src="app-script.js"></script>
  <script src="animated-list.js"></script>
  <script>
    let editorInstance = null;
    let detectedPkgs = new Set();
    let detectedVars = [];
    let detectedEnvKeys = new Set();
    let activeSecretMatch = null;

    const initialTemplate = `import React, { useState, useEffect } from 'react';

/**
 * useDebounce Hook
 * Debounces rapidly updating values by delay milliseconds.
 */
export function useDebounce<T>(value: T, delay: number = {{delay|300}}): T {
  const [debouncedVal, setDebouncedVal] = useState<T>(value);

  // Secret token simulation (will trigger secret scanner)
  const apiKey = "sk_live_948a8f1023ba192e44";

  useEffect(() => {
    const handler = setTimeout(() => {
      setDebouncedVal(value);
    }, delay);

    return () => clearTimeout(handler);
  }, [value, delay]);

  return debouncedVal;
}
`;

    // ── 1. Monaco Editor Initialization ─────────────────────
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      // Custom Cyber Pluck Theme
      monaco.editor.defineTheme('pluckCyberTheme', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'comment', foreground: '64748b', fontStyle: 'italic' },
          { token: 'keyword', foreground: 'f472b6', fontStyle: 'bold' },
          { token: 'string', foreground: 'a7f3d0' },
          { token: 'number', foreground: 'fbbf24' },
          { token: 'type', foreground: '67e8f9' },
          { token: 'function', foreground: 'c084fc' },
          { token: 'variable', foreground: 'e2e8f0' }
        ],
        colors: {
          'editor.background': '#0b0f19',
          'editor.foreground': '#f8fafc',
          'editorCursor.foreground': '#38bdf8',
          'editor.lineHighlightBackground': '#1e293b44',
          'editorLineNumber.foreground': '#475569',
          'editorLineNumber.activeForeground': '#c084fc',
          'editor.selectionBackground': '#7c3aed40',
          'editor.inactiveSelectionBackground': '#7c3aed20',
          'editorGutter.background': '#0b0f19'
        }
      });

      const container = document.getElementById('monaco-container');
      editorInstance = monaco.editor.create(container, {
        value: initialTemplate,
        language: 'typescript',
        theme: 'pluckCyberTheme',
        fontFamily: '"Space Mono", monospace',
        fontSize: 13,
        lineHeight: 22,
        tabSize: 2,
        minimap: { enabled: true, maxColumn: 45 },
        automaticLayout: true,
        scrollBeyondLastLine: false,
        renderLineHighlight: 'all',
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        padding: { top: 16, bottom: 16 }
      });

      // Analyze code on changes
      editorInstance.onDidChangeModelContent(() => {
        handleCodeAnalysis(editorInstance.getValue());
      });

      // Run initial analysis
      handleCodeAnalysis(initialTemplate);

      // Check if editing existing snippet (?id=...)
      checkEditMode();
    });

    // ── 2. Live AST & Secret Analysis ───────────────────────
    function handleCodeAnalysis(code) {
      document.getElementById('save-status-pill').textContent = '● Editing';
      document.getElementById('save-status-pill').style.color = 'var(--yellow)';
      document.getElementById('save-status-pill').style.borderColor = 'var(--yellow)';

      // 1. Detect Package Imports (AST approximation)
      const importMatches = code.matchAll(/(?:import\s+(?:[\w*\s{},]+)\s+from\s+['"]([^'"]+)['"]|require\(\s*['"]([^'"]+)['"]\s*\))/g);
      const newPkgs = new Set();
      for (const m of importMatches) {
        const pkg = m[1] || m[2];
        if (pkg && !pkg.startsWith('.') && !pkg.startsWith('node:')) {
          newPkgs.add(pkg.split('/')[0]);
        }
      }
      detectedPkgs = newPkgs;
      renderDetectedPkgs();

      // 2. Secret Scan (Credential / Token patterns)
      const secretRegex = /(sk_live_[a-zA-Z0-9]{16,}|ghp_[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|bearer\s+[a-zA-Z0-9_\-\.]{25,})/i;
      const secretMatch = code.match(secretRegex);
      const secretBanner = document.getElementById('secret-banner');
      if (secretMatch) {
        activeSecretMatch = secretMatch[0];
        secretBanner.style.display = 'flex';
      } else {
        activeSecretMatch = null;
        secretBanner.style.display = 'none';
      }

      // 3. Environment Variables (process.env.XYZ)
      const envMatches = code.matchAll(/process\.env\.([A-Z0-9_]+)/g);
      const newEnvs = new Set();
      for (const m of envMatches) {
        newEnvs.add(m[1]);
      }
      detectedEnvKeys = newEnvs;
      renderDetectedEnvs();

      // 4. Interpolated Variables {{varName|default}}
      const varMatches = code.matchAll(/\{\{([a-zA-Z0-9_]+)(?:\|([^}]+))?\}\}/g);
      detectedVars = [];
      for (const m of varMatches) {
        detectedVars.push({ name: m[1], defaultVal: m[2] || '' });
      }
      renderDetectedVars();
    }

    function getPackageDescription(pkg) {
      const descriptions = {
        'react': 'v18.2.0 • Core UI Library',
        'framer-motion': 'v11.0.8 • Spring Physics Engine',
        'lucide-react': 'v0.344.0 • Modern SVG Icons',
        'axios': 'v1.6.7 • Promise HTTP Client',
        '@supabase/supabase-js': 'v2.39.0 • Cloud Database Client',
        'canvas-confetti': 'v1.9.2 • High-Perf Canvas FX',
        'clsx': 'v2.1.0 • Classnames Utility',
        'tailwind-merge': 'v2.2.1 • CSS Class Conflict Resolver'
      };
      return descriptions[pkg] || 'npm package dependency';
    }

    function getEnvDescription(key) {
      const descriptions = {
        'NEXT_PUBLIC_SUPABASE_URL': 'Backend API Endpoint URI',
        'SUPABASE_ANON_KEY': 'Public client JWT credential',
        'STRIPE_SECRET_KEY': 'Billing API secret token',
        'REDIS_HOST': 'Distributed cache cluster host',
        'DATABASE_URL': 'PostgreSQL connection URI',
        'NODE_ENV': 'Runtime environment mode'
      };
      return descriptions[key] || 'Environment secret variable';
    }

    function renderDetectedPkgs() {
      const countEl = document.getElementById('pkg-count');
      if (countEl) countEl.textContent = detectedPkgs.size;

      const container = document.getElementById('detected-packages-list');
      if (!container) return;

      if (detectedPkgs.size === 0) {
        container.innerHTML = `
          <div style="font-size: 11px; color: #64748b; font-style: italic; padding: 12px; text-align: center; border: 1px dashed #334155; border-radius: 5px;">
            No imports detected. Add "import ... from 'package'" in code.
          </div>
        `;
        return;
      }

      container.innerHTML = Array.from(detectedPkgs).map(pkg => `
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
            <span style="font-weight: 700; color: #f472b6; font-family: var(--mono); font-size: 13px;">${escapeHtml(pkg)}</span>
            <span style="font-size: 10px; color: #94a3b8; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(getPackageDescription(pkg))}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
            <span class="dep-chip" style="font-size: 10px; padding: 2px 7px; color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1);">npm</span>
            <button onclick="removePkg('${escapeHtml(pkg)}')" title="Remove dependency" style="background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 3px; line-height: 1;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#64748b'">✕</button>
          </div>
        </div>
      `).join('');
    }

    function removePkg(pkg) {
      detectedPkgs.delete(pkg);
      renderDetectedPkgs();
      showToast(`Removed dependency: ${pkg}`, 'info');
    }

    function renderDetectedEnvs() {
      const countEl = document.getElementById('env-count');
      if (countEl) countEl.textContent = detectedEnvKeys.size;

      const container = document.getElementById('detected-env-list');
      if (!container) return;

      if (detectedEnvKeys.size === 0) {
        container.innerHTML = `
          <div style="font-size: 11px; color: #64748b; font-style: italic; padding: 12px; text-align: center; border: 1px dashed #334155; border-radius: 5px;">
            No environment keys detected. Use process.env.KEY in snippet code.
          </div>
        `;
        return;
      }

      container.innerHTML = Array.from(detectedEnvKeys).map(key => `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #38bdf8; font-weight: 700; font-family: var(--mono); font-size: 12px;">process.env.${escapeHtml(key)}</span>
            <span class="dep-chip" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); font-size: 9px;">Secret</span>
          </div>
          <div style="font-size: 11px; color: #94a3b8; margin-top: 6px;">${escapeHtml(getEnvDescription(key))}</div>
        </div>
      `).join('');
    }

    function renderDetectedVars() {
      const countEl = document.getElementById('var-count');
      if (countEl) countEl.textContent = detectedVars.length;

      const container = document.getElementById('detected-vars-list');
      if (!container) return;

      if (detectedVars.length === 0) {
        container.innerHTML = `
          <div style="font-size: 11px; color: #64748b; font-style: italic; padding: 12px; text-align: center; border: 1px dashed #334155; border-radius: 5px;">
            No variables detected. Syntax: {{name|default}}
          </div>
        `;
        return;
      }

      container.innerHTML = detectedVars.map(v => `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span style="color: #fbbf24; font-weight: 700; font-family: var(--mono); font-size: 12px;">{{${escapeHtml(v.name)}}}</span>
            <span class="dep-chip" style="font-size: 9px; color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);">${v.defaultVal ? (isNaN(v.defaultVal) ? 'string' : 'number') : 'var'}</span>
          </div>
          <div class="form-group" style="margin-top: 8px;">
            <label class="form-label" style="font-size: 10px;">DEFAULT VALUE</label>
            <input type="text" class="var-input" value="${escapeHtml(v.defaultVal)}" style="font-size: 11px; padding: 6px 10px;" />
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // ── 3. Redact / Secret Actions ──────────────────────────
    function redactSecret() {
      if (!editorInstance) return;
      const currentCode = editorInstance.getValue();
      let updated = currentCode;

      if (activeSecretMatch) {
        updated = updated.replace(activeSecretMatch, 'process.env.API_KEY');
      } else {
        updated = updated.replace(/('sk_live_[^']+'|"sk_live_[^"]+"|sk_live_[a-zA-Z0-9]+)/g, 'process.env.STRIPE_KEY');
      }

      editorInstance.setValue(updated);
      document.getElementById('secret-banner').style.display = 'none';
      showToast('Redacted secret → Replaced with process.env.API_KEY', 'success');
      switchInspectorTab('env');
    }

    function ignoreSecret() {
      document.getElementById('secret-banner').style.display = 'none';
      showToast('Secret flagged as acknowledged for Private scope', 'info');
    }

    function switchInspectorTab(tab) {
      ['pkgs', 'vars', 'env', 'details'].forEach(t => {
        document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
        document.getElementById(`panel-${t}`).style.display = t === tab ? 'flex' : 'none';
      });
    }

    function changeLanguage(lang) {
      if (editorInstance && window.monaco) {
        const monacoLangMap = {
          typescript: 'typescript',
          javascript: 'javascript',
          python: 'python',
          go: 'go',
          sql: 'sql',
          json: 'json',
          html: 'html',
          css: 'css',
          rust: 'rust',
          java: 'java',
          shell: 'shell'
        };
        const target = monacoLangMap[lang] || 'plaintext';
        monaco.editor.setModelLanguage(editorInstance.getModel(), target);
      }
      showToast(`Monaco language changed to ${lang}`, 'info');
    }

    // ── 3b. Custom Animated Dropdown Handlers (React Bits AnimatedList) ──
    const LANGUAGE_LIST = [
      { id: 'typescript', name: 'TypeScript', ext: '.ts', desc: 'Typed JavaScript Superset', icon: AnimatedList.GLYPHS.code },
      { id: 'javascript', name: 'JavaScript', ext: '.js', desc: 'Dynamic ECMAScript Runtime', icon: AnimatedList.GLYPHS.code },
      { id: 'python', name: 'Python', ext: '.py', desc: 'Clean High-Level Language', icon: AnimatedList.GLYPHS.file },
      { id: 'go', name: 'Go', ext: '.go', desc: 'Concurrent Compiled Systems', icon: AnimatedList.GLYPHS.code },
      { id: 'sql', name: 'SQL', ext: '.sql', desc: 'Relational Database Queries', icon: AnimatedList.GLYPHS.database },
      { id: 'json', name: 'JSON', ext: '.json', desc: 'Structured Data Interchange', icon: AnimatedList.GLYPHS.note },
      { id: 'html', name: 'HTML', ext: '.html', desc: 'HyperText Markup Language', icon: AnimatedList.GLYPHS.presentation },
      { id: 'css', name: 'CSS', ext: '.css', desc: 'Cascading Style Sheets', icon: AnimatedList.GLYPHS.image },
      { id: 'rust', name: 'Rust', ext: '.rs', desc: 'Memory-Safe Systems Code', icon: AnimatedList.GLYPHS.zip },
      { id: 'java', name: 'Java', ext: '.java', desc: 'JVM Enterprise Applications', icon: AnimatedList.GLYPHS.folder },
      { id: 'shell', name: 'Shell', ext: '.sh', desc: 'Unix Bash & Zsh Scripts', icon: AnimatedList.GLYPHS.code }
    ];

    const FOLDER_LIST = [
      { id: 'hooks', name: 'hooks', desc: 'Custom React & DOM Hooks', icon: AnimatedList.GLYPHS.folder, meta: 'Folder' },
      { id: 'auth', name: 'auth', desc: 'OAuth & Session Guards', icon: AnimatedList.GLYPHS.key, meta: 'Folder' },
      { id: 'aws-infra', name: 'aws-infra', desc: 'Terraform & Lambda Specs', icon: AnimatedList.GLYPHS.database, meta: 'Folder' },
      { id: 'database', name: 'database', desc: 'Prisma & Mongoose Schemas', icon: AnimatedList.GLYPHS.table, meta: 'Folder' }
    ];

    const VISIBILITY_LIST = [
      { id: 'private', name: 'Private', desc: 'Encrypted & personal to your vault', icon: AnimatedList.GLYPHS.key, meta: '🔒' },
      { id: 'team', name: 'Team', desc: 'Shared with workspace collaborators', icon: AnimatedList.GLYPHS.folder, meta: '👥' },
      { id: 'unlisted', name: 'Unlisted', desc: 'Accessible only via secret link', icon: AnimatedList.GLYPHS.note, meta: '🔗' },

    ];

    let langDropdownList = null;
    let folderDropdownList = null;
    let visibilityDropdownList = null;

    function toggleLangDropdown(event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('lang-dropdown-popover');
      const trigger = document.getElementById('lang-dropdown-trigger');
      const isOpen = popover && popover.style.display !== 'none';

      if (isOpen) {
        closeLangDropdown();
      } else {
        closeAllDropdowns();
        popover.style.display = 'block';
        trigger.classList.add('active');

        const currentLang = document.getElementById('select-lang')?.value || 'typescript';
        const currentIndex = LANGUAGE_LIST.findIndex(l => l.id === currentLang);

        if (!langDropdownList) {
          const items = LANGUAGE_LIST.map(l => ({
            id: l.id,
            icon: l.icon,
            title: `${l.name} (${l.ext})`,
            description: l.desc,
            meta: l.ext
          }));

          langDropdownList = new AnimatedList('#lang-animated-list', {
            items,
            animation: 'pop',
            theme: 'dark',
            radius: 12,
            gap: 6,
            width: 300,
            maxHeight: 350,
            fadeSize: 44,
            showGradients: true,
            displayScrollbar: true,
            frame: true,
            stagger: 0.03,
            initialSelectedIndex: currentIndex >= 0 ? currentIndex : 0,
            onItemSelect: (item) => {
              selectLanguage(item.id);
            }
          });
        } else {
          if (currentIndex >= 0) langDropdownList.setSelected(currentIndex);
          langDropdownList.refresh();
        }
      }
    }

    function selectLanguage(langId) {
      const selectEl = document.getElementById('select-lang');
      if (selectEl) selectEl.value = langId;

      const found = LANGUAGE_LIST.find(l => l.id === langId);
      const labelEl = document.getElementById('lang-dropdown-text');
      if (labelEl && found) {
        labelEl.textContent = `${found.name} (${found.ext})`;
      }

      changeLanguage(langId);
      closeLangDropdown();
    }

    function closeLangDropdown() {
      const popover = document.getElementById('lang-dropdown-popover');
      const trigger = document.getElementById('lang-dropdown-trigger');
      if (popover) popover.style.display = 'none';
      if (trigger) trigger.classList.remove('active');
    }

    function toggleFolderDropdown(event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('folder-dropdown-popover');
      const trigger = document.getElementById('folder-dropdown-trigger');
      const isOpen = popover && popover.style.display !== 'none';

      if (isOpen) {
        closeFolderDropdown();
      } else {
        closeAllDropdowns();
        popover.style.display = 'block';
        trigger.classList.add('active');

        const currentFolder = document.getElementById('select-folder')?.value || 'hooks';
        const currentIndex = FOLDER_LIST.findIndex(f => f.id === currentFolder);

        if (!folderDropdownList) {
          const items = FOLDER_LIST.map(f => ({
            id: f.id,
            icon: f.icon,
            title: `Folder: ${f.name}`,
            description: f.desc,
            meta: f.meta
          }));

          folderDropdownList = new AnimatedList('#folder-animated-list', {
            items,
            animation: 'pop',
            theme: 'dark',
            radius: 12,
            gap: 6,
            width: 290,
            maxHeight: 280,
            fadeSize: 36,
            showGradients: true,
            displayScrollbar: true,
            frame: true,
            stagger: 0.04,
            initialSelectedIndex: currentIndex >= 0 ? currentIndex : 0,
            onItemSelect: (item) => {
              selectFolder(item.id);
            }
          });
        } else {
          if (currentIndex >= 0) folderDropdownList.setSelected(currentIndex);
          folderDropdownList.refresh();
        }
      }
    }

    function selectFolder(folderId) {
      const selectEl = document.getElementById('select-folder');
      if (selectEl) selectEl.value = folderId;

      const found = FOLDER_LIST.find(f => f.id === folderId);
      const labelEl = document.getElementById('folder-dropdown-text');
      if (labelEl && found) {
        labelEl.textContent = `📁 Folder: ${found.name}`;
      }
      showToast(`Selected folder: ${folderId}`, 'info');
      closeFolderDropdown();
    }

    function closeFolderDropdown() {
      const popover = document.getElementById('folder-dropdown-popover');
      const trigger = document.getElementById('folder-dropdown-trigger');
      if (popover) popover.style.display = 'none';
      if (trigger) trigger.classList.remove('active');
    }

    function toggleVisibilityDropdown(event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('visibility-dropdown-popover');
      const trigger = document.getElementById('visibility-dropdown-trigger');
      const isOpen = popover && popover.style.display !== 'none';

      if (isOpen) {
        closeVisibilityDropdown();
      } else {
        closeAllDropdowns();
        popover.style.display = 'block';
        trigger.classList.add('active');

        const currentVis = document.getElementById('select-visibility')?.value || 'private';
        const currentIndex = VISIBILITY_LIST.findIndex(v => v.id === currentVis);

        if (!visibilityDropdownList) {
          const items = VISIBILITY_LIST.map(v => ({
            id: v.id,
            icon: v.icon,
            title: `${v.meta} ${v.name}`,
            description: v.desc,
            meta: v.meta
          }));

          visibilityDropdownList = new AnimatedList('#visibility-animated-list', {
            items,
            animation: 'pop',
            theme: 'dark',
            radius: 12,
            gap: 6,
            width: 310,
            maxHeight: 280,
            fadeSize: 36,
            showGradients: true,
            displayScrollbar: true,
            frame: true,
            stagger: 0.04,
            initialSelectedIndex: currentIndex >= 0 ? currentIndex : 0,
            onItemSelect: (item) => {
              selectVisibility(item.id);
            }
          });
        } else {
          if (currentIndex >= 0) visibilityDropdownList.setSelected(currentIndex);
          visibilityDropdownList.refresh();
        }
      }
    }

    function selectVisibility(visId) {
      checkVisibilityGating(visId);
      const selectEl = document.getElementById('select-visibility');
      if (selectEl) selectEl.value = visId;

      const found = VISIBILITY_LIST.find(v => v.id === visId);
      const labelEl = document.getElementById('visibility-dropdown-text');
      if (labelEl && found) {
        labelEl.textContent = `${found.meta} ${found.name}`;
      }
      showToast(`Snippet visibility: ${visId}`, 'info');
      closeVisibilityDropdown();
    }

    function closeVisibilityDropdown() {
      const popover = document.getElementById('visibility-dropdown-popover');
      const trigger = document.getElementById('visibility-dropdown-trigger');
      if (popover) popover.style.display = 'none';
      if (trigger) trigger.classList.remove('active');
    }

    function closeAllDropdowns() {
      closeLangDropdown();
      closeFolderDropdown();
      closeVisibilityDropdown();
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#lang-dropdown-container')) closeLangDropdown();
      if (!e.target.closest('#folder-dropdown-container')) closeFolderDropdown();
      if (!e.target.closest('#visibility-dropdown-container')) closeVisibilityDropdown();
    });

    function addManualPkg() {
      const input = document.getElementById('add-pkg-input');
      const val = input.value.trim();
      if (val) {
        detectedPkgs.add(val);
        renderDetectedPkgs();
        showToast(`Added dependency: ${val}`, 'success');
        input.value = '';
      }
    }

    function checkVisibilityGating(val) {
      if (val === 'public' && activeSecretMatch) {
        alert('Gating Violation: Snippets with active secrets cannot be published to Public scope.');
        document.getElementById('select-visibility').value = 'private';
      }
    }

    // ── 4. Save to MongoDB & Local Storage ───────────────────
    async function saveSnippet() {
      if (!editorInstance) return;

      const title = document.getElementById('snippet-title').value.trim() || 'Untitled Snippet';
      const code = editorInstance.getValue();
      const language = document.getElementById('select-lang').value;
      const folderId = document.getElementById('select-folder').value;
      const visibility = document.getElementById('select-visibility').value;
      const desc = document.getElementById('snippet-desc').value.trim();
      const tagsVal = document.getElementById('snippet-tags').value;
      const tags = tagsVal ? tagsVal.split(',').map(t => t.trim()).filter(Boolean) : [];

      const btn = document.getElementById('btn-save');
      btn.textContent = 'Saving to MongoDB...';
      btn.disabled = true;

      let savedSnippet = null;
      try {
        const res = await fetch('/api/snippets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            code,
            language,
            folderId,
            folderName: folderId,
            visibility,
            tags,
            description: desc,
            dependencies: Array.from(detectedPkgs).map(p => ({ name: p, version: 'latest' })),
            envKeys: Array.from(detectedEnvKeys),
            acknowledgeSecrets: true
          })
        });

        if (res.ok) {
          const json = await res.json();
          savedSnippet = json.snippet;
        }
      } catch (err) {
        console.warn('Backend unavailable, caching locally:', err);
      }

      if (!savedSnippet) {
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'snip_' + Date.now();
        savedSnippet = {
          id: slug,
          slug,
          title,
          code,
          language,
          folderId,
          folderName: folderId,
          visibility,
          tags,
          dependencies: Array.from(detectedPkgs).map(p => ({ name: p, version: 'latest' })),
          description: desc,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }

      // Update local storage cache
      let localSnippets = [];
      try {
        localSnippets = JSON.parse(localStorage.getItem('pluck_user_snippets') || '[]');
      } catch (e) { localSnippets = []; }

      const idx = localSnippets.findIndex(s => s.id === savedSnippet.id);
      if (idx >= 0) {
        localSnippets[idx] = savedSnippet;
      } else {
        localSnippets.unshift(savedSnippet);
      }
      try {
        localStorage.setItem('pluck_user_snippets', JSON.stringify(localSnippets));
      } catch (e) {}

      showToast(`Snippet "${title}" saved to MongoDB Vault!`, 'success');
      setTimeout(() => {
        window.location.href = 'app.html';
      }, 500);
    }

    // ── 5. Edit Existing Snippet Support (?id=...) ───────────
    async function checkEditMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');
      if (!editId) return;

      try {
        const res = await fetch(`/api/snippets/${encodeURIComponent(editId)}`);
        if (res.ok) {
          const data = await res.json();
          const s = data.snippet;
          if (s) {
            document.getElementById('snippet-title').value = s.title || '';
            if (s.language) {
              document.getElementById('select-lang').value = s.language;
              changeLanguage(s.language);
            }
            if (s.folderId) document.getElementById('select-folder').value = s.folderId;
            if (s.visibility) document.getElementById('select-visibility').value = s.visibility;
            if (s.tags && s.tags.length) document.getElementById('snippet-tags').value = s.tags.join(', ');
            if (s.code && editorInstance) {
              editorInstance.setValue(s.code);
            }
            showToast(`Loaded snippet "${s.title}" for editing`, 'info');
          }
        }
      } catch (err) {
        console.warn('Failed to fetch snippet for editing:', err);
      }
    }

    // ── 6. Populate Folders from MongoDB ─────────────────────
    async function loadFoldersDropdown() {
      try {
        const res = await fetch('/api/folders');
        if (res.ok) {
          const data = await res.json();
          const folders = data.folders || [];
          if (folders.length > 0) {
            const selectEl = document.getElementById('select-folder');
            selectEl.innerHTML = folders.map(f => `
              <option value="${f.id}">${f.emoji || '📁'} Folder: ${f.name}</option>
            `).join('');
          }
        }
      } catch (e) {}
    }

    // Keyboard shortcut Cmd+S / Ctrl+S
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveSnippet();
      }
    });

    document.addEventListener('DOMContentLoaded', loadFoldersDropdown);
  </script>
  <script src="border-glow.js"></script>
</body>

</html>
