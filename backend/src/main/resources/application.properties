spring.application.name=pluck-backend
server.port=${PORT:4000}

# MongoDB Connection (from environment or local default)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/pluck}

# Serve frontend static assets from ../frontend
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# SMTP Email Configuration (PRD §2.6.2 & §M4.1)
# You can set SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD in environment variables
# For Gmail: use an App Password (not your normal account password)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Pluck App Settings
pluck.mail.from=${PLUCK_MAIL_FROM:notifications@pluck.dev}
pluck.app.base-url=${PLUCK_APP_BASE_URL:http://localhost:4000}

# Google OAuth 2.0 Credentials (GIS)
google.client.id=${GOOGLE_CLIENT_ID:${client_id:}}
google.client.secret=${GOOGLE_CLIENT_SECRET:${client_secret:}}

